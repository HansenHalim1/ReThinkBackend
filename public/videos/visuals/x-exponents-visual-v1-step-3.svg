<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img"><title>Pangkat menghitung faktor. Apa yang berubah ketika pangkat bertambah satu? 2^3 = 8; naik satu pangkat → dikali 2</title><rect width="640" height="240" fill="#fffdf6"/><line x1="65" y1="190" x2="580" y2="190" stroke="#172b66" stroke-width="2.5" fill="none"/><rect x="75" y="185.625" width="69.6" height="4.375" rx="3" stroke="#2849ad" stroke-width="2.5" fill="#2849ad"/><text x="109.8" y="175.625" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#2849ad">1</text><text x="109.8" y="218" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#172b66">2^0</text><rect x="195" y="181.25" width="69.6" height="8.75" rx="3" stroke="#2849ad" stroke-width="2.5" fill="#2849ad"/><text x="229.8" y="171.25" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#2849ad">2</text><text x="229.8" y="218" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#172b66">2^1</text><rect x="315" y="172.5" width="69.6" height="17.5" rx="3" stroke="#2849ad" stroke-width="2.5" fill="#2849ad"/><text x="349.8" y="162.5" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#2849ad">4</text><text x="349.8" y="218" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#172b66">2^2</text><rect x="435" y="155" width="69.6" height="35" rx="3" stroke="#2849ad" stroke-width="2.5" fill="#2849ad"/><text x="469.8" y="145" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#2849ad">8</text><text x="469.8" y="218" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#172b66">2^3</text></svg>