<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img"><title>Satu putaran, semua kuadran. Bagaimana lingkaran satuan memberi tanda sinus dan kosinus? Titik (cos θ, sin θ) = (-1, 0)</title><rect width="640" height="240" fill="#fffdf6"/><circle cx="250" cy="115" r="85" stroke="#2849ad" stroke-width="2.5" fill="#fffdf6"/><line x1="130" y1="115" x2="370" y2="115" stroke="#d8d5ca" stroke-width="2.5" fill="none"/><line x1="250" y1="15" x2="250" y2="215" stroke="#d8d5ca" stroke-width="2.5" fill="none"/><line x1="250" y1="115" x2="165" y2="114.99999999999999" stroke="#c94f2d" stroke-width="2.5" fill="none"/><line x1="165" y1="114.99999999999999" x2="165" y2="115" stroke="#28766d" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/><circle cx="165" cy="114.99999999999999" r="6" stroke="#c94f2d" stroke-width="2.5" fill="#c94f2d"/><text x="475" y="65" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#172b66">θ = 180°</text><text x="475" y="111" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#2849ad">cos θ = -1</text><text x="475" y="151" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#28766d">sin θ = 0</text></svg>