idth="2.5" stroke-dasharray="6 5" fill="none"/><text x="190" y="35" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#172b66">garis emas: median</text><text x="460" y="35" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#28766d">segitiga hijau: mean</text></svg>