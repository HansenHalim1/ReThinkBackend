<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img"><title>Menjaga persamaan seimbang. Bagaimana menemukan x tanpa mengubah keseimbangan? Periksa: 6 + 1 = 7</title><rect width="640" height="240" fill="#fffdf6"/><rect x="35" y="55" width="160" height="115" rx="3" stroke="#2849ad" stroke-width="2.5" fill="#e5e9f4"/><text x="115" y="86" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#172b66">PERSAMAAN</text><text x="115" y="132" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#2849ad">x + 1 = 7</text><line x1="205" y1="112" x2="230" y2="112" stroke="#2849ad" stroke-width="2.5" fill="none"/><polygon points="230,112 221.8959760788259,115.91468980700107 221.8959760788259,108.08531019299893" stroke="#2849ad" stroke-width="2.5" fill="#2849ad"/><rect x="240" y="55" width="160" height="115" rx="3" stroke="#2849ad" stroke-width="2.5" fill="#f8e9b2"/><text x="320" y="86" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#172b66">KEDUA RUAS − 1</text><text x="320" y="132" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#c94f2d">x = 7 − 1</text><line x1="410" y1="112" x2="435" y2="112" stroke="#2849ad" stroke-width="2.5" fill="none"/><polygon points="435,112 426.8959760788259,115.91468980700107 426.8959760788259,108.08531019299893" stroke="#2849ad" stroke-width="2.5" fill="#2849ad"/><rect x="445" y="55" width="160" height="115" rx="3" stroke="#2849ad" stroke-width="2.5" fill="#e5e9f4"/><text x="525" y="86" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#172b66">HASIL</text><text x="525" y="132" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" fill="#2849ad">x = 6</text></svg>