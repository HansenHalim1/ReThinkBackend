<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img"><title>Jangan hitung irisan dua kali. Bagaimana mencari peluang A atau B? P(A ∪ B) = 4/6; irisan 1/6 dihitung satu kali</title><rect width="640" height="240" fill="#fffdf6"/><circle cx="85" cy="105" r="30" stroke="#6a7387" stroke-width="2.5" fill="#6a7387"/><text x="85" y="113" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#ffffff">1</text><circle cx="180" cy="105" r="30" stroke="#2849ad" stroke-width="2.5" fill="#2849ad"/><text x="180" y="113" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#ffffff">2</text><circle cx="275" cy="105" r="30" stroke="#6a7387" stroke-width="2.5" fill="#6a7387"/><text x="275" y="113" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#ffffff">3</text><circle cx="370" cy="105" r="30" stroke="#2849ad" stroke-width="2.5" fill="#2849ad"/><text x="370" y="113" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#ffffff">4</text><circle cx="465" cy="105" r="30" stroke="#c94f2d" stroke-width="2.5" fill="#c94f2d"/><text x="465" y="113" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#ffffff">5</text><circle cx="560" cy="105" r="30" stroke="#28766d" stroke-width="2.5" fill="#28766d"/><text x="560" y="113" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#ffffff">6</text><text x="150" y="35" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#2849ad">A: genap</text><text x="455" y="35" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#c94f2d">B: angka ≥ 5</text><text x="320" y="183" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#28766d">hijau: irisan A dan B</text></svg>